# One build per desktop OS. Each job tests, builds the installers and uploads each
# as a workflow artifact of its own. Signing/notarization and releases come later.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            # Apple Silicon only (the runner's own architecture); Intel Macs aren't supported.
            os: macos-latest
            args: ""
            targets: ""
            bundle: target/release/bundle
          - name: Windows
            os: windows-latest
            args: ""
            targets: ""
            bundle: target/release/bundle
          - name: Linux
            os: ubuntu-22.04
            args: ""
            targets: ""
            bundle: target/release/bundle
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # webkit for Tauri, dbus for the keychain (Secret Service).
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Test core and Matrix adapter
        run: cargo test --workspace

      - name: Check translations and build installer
        working-directory: apps/desktop
        run: npm run tauri build -- ${{ matrix.args }}

      # One download per installer, so nobody gets the app twice (the .dmg already holds the .app;
      # Windows and Linux each have two kinds of installer). Kept 30 days.
      - name: Upload ms_trix-macOS-dmg
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ms_trix-macOS-dmg
          path: ${{ matrix.bundle }}/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
          # Installers are compressed already.
          compression-level: 0

      - name: Upload ms_trix-Windows-setup
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ms_trix-Windows-setup
          path: ${{ matrix.bundle }}/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
          # Installers are compressed already.
          compression-level: 0

      - name: Upload ms_trix-Windows-msi
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ms_trix-Windows-msi
          path: ${{ matrix.bundle }}/msi/*.msi
          if-no-files-found: error
          retention-days: 30
          # Installers are compressed already.
          compression-level: 0

      - name: Upload ms_trix-Linux-deb
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ms_trix-Linux-deb
          path: ${{ matrix.bundle }}/deb/*.deb
          if-no-files-found: error
          retention-days: 30
          # Installers are compressed already.
          compression-level: 0

      - name: Upload ms_trix-Linux-AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ms_trix-Linux-AppImage
          path: ${{ matrix.bundle }}/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30
          # Installers are compressed already.
          compression-level: 0
