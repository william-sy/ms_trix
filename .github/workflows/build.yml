# One build per desktop OS. Each job tests, builds the installers and uploads each
# as a workflow artifact of its own. A version tag (v1.5.1) also publishes them as a GitHub
# Release with that version's notes from RELEASE_NOTES.md. Signing/notarization come later.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            # Apple Silicon only (the runner's own architecture); Intel Macs aren't supported.
            os: macos-latest
            args: ""
            targets: ""
            bundle: target/release/bundle
          - name: Windows
            os: windows-latest
            args: ""
            targets: ""
            bundle: target/release/bundle
          - name: Linux
            os: ubuntu-22.04
            args: ""
            targets: ""
            bundle: target/release/bundle
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # webkit for Tauri, dbus for the keychain (Secret Service).
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Test core and Matrix adapter
        run: cargo test --workspace

      # With the update key (secret) the update files are signed for the in-app updater; without it
      # (forks, pull requests) the installers are built without update files.
      - name: Check translations and build installer
        working-directory: apps/desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npm run tauri build -- ${{ matrix.args }}
          else
            npm run tauri build -- ${{ matrix.args }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      # One download per installer, so nobody gets the app twice (the .dmg already holds the .app;
      # Windows and Linux each have two kinds of installer). Kept 30 days.
      - name: Upload trixcomm-macOS-dmg
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: trixcomm-macOS-dmg
          path: ${{ matrix.bundle }}/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
          # Installers are compressed already.
          compression-level: 0

      - name: Upload trixcomm-Windows-setup
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: trixcomm-Windows-setup
          path: ${{ matrix.bundle }}/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
          # Installers are compressed already.
          compression-level: 0

      - name: Upload trixcomm-Windows-msi
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: trixcomm-Windows-msi
          path: ${{ matrix.bundle }}/msi/*.msi
          if-no-files-found: error
          retention-days: 30
          # Installers are compressed already.
          compression-level: 0

      - name: Upload trixcomm-Linux-deb
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: trixcomm-Linux-deb
          path: ${{ matrix.bundle }}/deb/*.deb
          if-no-files-found: error
          retention-days: 30
          # Installers are compressed already.
          compression-level: 0

      - name: Upload trixcomm-Linux-AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: trixcomm-Linux-AppImage
          path: ${{ matrix.bundle }}/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 30
          # Installers are compressed already.
          compression-level: 0

      # For the release: the updater's signatures (and macOS's update archive, the .app packed).
      - name: Upload trixcomm-${{ matrix.name }}-updater
        uses: actions/upload-artifact@v7
        with:
          name: trixcomm-${{ matrix.name }}-updater
          path: |
            ${{ matrix.bundle }}/macos/*.app.tar.gz
            ${{ matrix.bundle }}/*/*.sig
          if-no-files-found: ignore
          retention-days: 7

  # A version tag: once every OS built, one release with all installers and the version's notes.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag is the app's version
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but the app is version $version"
            exit 1
          fi

      # The version's section: from "## 1.5.1 (date)" up to the next "## ".
      - name: Release notes
        run: |
          awk -v head="## ${GITHUB_REF_NAME#v} (" '/^## / { on = index($0, head) == 1; next } on' RELEASE_NOTES.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::No section for ${GITHUB_REF_NAME#v} in RELEASE_NOTES.md"
            exit 1
          fi
          cp notes.md body.md
          printf '\n---\nNot signed yet: see [Installing](https://github.com/%s#installing) for the one-time step on macOS and Windows.\n' "$GITHUB_REPOSITORY" >> body.md

      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true

      # All files side by side (the signatures came from several folders); the macOS update
      # archive (Trixcomm.app.tar.gz) gets the version in its name like the rest.
      - name: Update manifest
        run: |
          find installers -mindepth 2 -type f -exec mv {} installers/ \;
          version="${GITHUB_REF_NAME#v}"
          for f in installers/*.app.tar.gz*; do
            [ -e "$f" ] && mv "$f" "installers/Trixcomm_${version}_aarch64.${f#installers/Trixcomm.}"
          done
          node apps/desktop/scripts/update-manifest.mjs installers "$version" notes.md \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME" > installers/latest.json

      # The signatures are inside latest.json; the release lists the installers and it.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=()
          for f in installers/*; do [[ -f "$f" && "$f" != *.sig ]] && files+=("$f"); done
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag --title "Trixcomm ${GITHUB_REF_NAME#v}" --notes-file body.md
