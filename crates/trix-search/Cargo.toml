[package]
name = "trix-search"
description = "Encrypted local full-text search index for Trixcomm"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
trix-core.workspace = true
serde.workspace = true
serde_json = "1"
thiserror.workspace = true
# Same versions matrix-sdk already pulls in (SQLite + its store cipher).
rusqlite = { version = "0.40", features = ["bundled"] }
matrix-sdk-store-encryption = "0.19"

[dev-dependencies]
tempfile = "3"
