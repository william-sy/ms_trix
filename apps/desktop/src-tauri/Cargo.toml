[package]
name = "ms-trix-desktop"
version = "1.4.0"
description = "ms_trix desktop app"
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ms_trix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
base64 = "0.22"
tokio = { version = "1", features = ["time", "net", "sync"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# macos-private-api: transparent windows (the red border while sharing your screen).
tauri = { version = "2.12.5", features = ["tray-icon", "image-png", "macos-private-api", "unstable"] }
tauri-plugin-log = "2"
trix-core = { path = "../../../crates/trix-core" }
trix-matrix = { path = "../../../crates/trix-matrix" }
trix-talk = { path = "../../../crates/trix-talk" }
trix-ntfy = { path = "../../../crates/trix-ntfy" }
trix-search = { path = "../../../crates/trix-search" }
rand = "0.9"
# Same version trix-matrix uses; content type of picked files.
mime_guess = "2"
tauri-plugin-opener = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
futures = "0.3"
percent-encoding = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
url = "2"
# Same version trix-talk uses; link previews.
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Same versions Tauri uses; the system spell checker (composer suggestions).
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSSpellChecker", "NSResponder", "NSView"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSRange", "NSArray", "NSObjCRuntime", "NSTextCheckingResult", "NSOrthography", "NSDictionary"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation"] }
